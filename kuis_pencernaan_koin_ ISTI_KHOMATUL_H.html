        }

        }

        .jar-container {
            position: relative;
            width: 130px;
            height: 190px;
            margin: 0 auto;
            margin-top: 10px;
        }

        .jar-back {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 100%;
            border: 6px solid rgba(255, 255, 255, 0.9);
            border-top: none;
            border-radius: 0 0 30px 30px;
            background: rgba(255, 255, 255, 0.4);
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.1);
            z-index: 5;
        }

        .jar-front {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 100%;
            border-radius: 0 0 30px 30px;
            background: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.4) 100%);
            z-index: 15;
            pointer-events: none;
            box-shadow: inset -5px -5px 15px rgba(255,255,255,0.6);
        }

        .jar-lip {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 124px;
            height: 24px;
            border: 6px solid rgba(255, 255, 255, 1);
            border-radius: 12px;
            background: rgba(220, 245, 255, 0.8);
            z-index: 16;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .coin-stack {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            height: 170px;
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            justify-content: flex-start;
            z-index: 10;
        }

        .coin {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffe066, #f59e0b);
            border: 4px solid #d97706;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.5), 0 4px 0 #b45309, 0 5px 5px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka One', cursive;
            font-size: 1.4rem;
            color: #fff;
            text-shadow: 2px 2px 0px #b45309;
            margin-top: -30px; 
            animation: dropIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
            position: relative;
        }

        @keyframes dropIn {
            0% { transform: translateY(-200px) scale(0.3) rotate(-20deg); opacity: 0; }
            50% { transform: translateY(20px) scale(1.1) rotate(10deg); }
            100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes shakeWrong {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            20%, 60% { transform: translateX(-8px) rotate(-3deg); }
            40%, 80% { transform: translateX(8px) rotate(3deg); }
        }

        .shake-animation {
            animation: shakeWrong 0.4s ease-in-out;
            border-color: #ef4444 !important;
            background-color: #fef2f2 !important;
        }

        .correct-animation {
            border-color: #22c55e !important;
            background-color: #f0fdf4 !important;
            transform: scale(1.02);
            transition: all 0.2s;
        }

        .team-panel {
            transition: all 0.3s ease;
        }

        .btn-hover-effect {
            transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
        }
        .btn-hover-effect:hover {
            filter: brightness(1.1);
        }
        .btn-hover-effect:active {

        }

        @keyframes float {

        @media (min-width: 1024px) {
            .grid-4 { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>

        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playCoinSound() {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            // Mengatur frekuensi untuk membuat suara "cling" koin
            osc.type = 'sine';
            osc.frequency.setValueAtTime(987.77, audioCtx.currentTime); // Note B5
            osc.frequency.exponentialRampToValueAtTime(1318.51, audioCtx.currentTime + 0.1); // Note E6
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

            document.querySelectorAll('.team-btn').forEach(btn => {
                btn.classList.remove('bg-blue-500', 'text-white', 'border-blue-700');
                btn.classList.add('bg-gray-200', 'text-gray-500', 'border-gray-400');
            });
            event.target.classList.remove('bg-gray-200', 'text-gray-500', 'border-gray-400');
            event.target.classList.add('bg-blue-500', 'text-white', 'border-blue-700');
        }

        function shuffleArray(array) {
            let curId = array.length;
            // There remain elements to shuffle
            while (0 !== curId) {
                // Pick a remaining element
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                // Swap it with the current element.
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        function startGame() {
            initAudio(); // Audio perlu diinisialisasi setelah ada interaksi user
            
            let targetInput = document.getElementById('target-score').value;
            targetScore = parseInt(targetInput);
            if(isNaN(targetScore) || targetScore < 1 || targetScore > 100) {
                targetScore = 15; // fallback
            }

            // Shuffle questions once for the whole game so all teams get same random order
            shuffledQuestions = shuffleArray([...bankSoal]);

            teams = [];
            for (let i = 0; i < numberOfTeams; i++) {
                teams.push({
                    id: i,
                    name: `Tim ${i + 1}`,
                    score: 0,
                    questionIndex: 0,
                    colors: getTeamColors(i)
                });
            }

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('winner-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('flex');
            
            gameActive = true;
            renderGameBoard();
        }

        function getTeamColors(index) {
            const colors = [
                { bg: 'bg-blue-200', header: 'bg-blue-500', text: 'text-white', border: 'border-blue-600' },
                { bg: 'bg-red-200', header: 'bg-red-500', text: 'text-white', border: 'border-red-600' },
                { bg: 'bg-green-200', header: 'bg-green-500', text: 'text-white', border: 'border-green-600' },
                { bg: 'bg-purple-200', header: 'bg-purple-500', text: 'text-white', border: 'border-purple-600' }
            ];
            return colors[index % colors.length];
        }

        function renderGameBoard() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            
            // Set grid class based on number of teams
            board.className = `w-full flex-grow grid gap-6 grid-${numberOfTeams}`;

            teams.forEach(team => {
                const q = shuffledQuestions[team.questionIndex];
                const isFinished = team.questionIndex >= shuffledQuestions.length;
                
                const teamPanel = document.createElement('div');
                teamPanel.id = `team-panel-${team.id}`;
                teamPanel.className = `team-panel ${team.colors.bg} rounded-[2rem] shadow-[0_8px_0_0_rgba(0,0,0,0.1)] border-4 ${team.colors.border} flex flex-col overflow-hidden relative`;
                
                // Header
                const header = document.createElement('div');
                header.className = `${team.colors.header} text-white font-bold text-center py-4 text-3xl font-fun tracking-wider border-b-4 ${team.colors.border} shadow-sm`;
                header.innerText = team.name;
                
                // Score Area (Coins)
                const scoreArea = document.createElement('div');
                scoreArea.className = 'flex-grow p-4 flex flex-col items-center justify-end relative bg-white/40';
                scoreArea.innerHTML = `
                    <div class="absolute top-3 right-4 bg-white/80 px-3 py-1 rounded-full font-fun text-xl ${team.colors.text.replace('white', 'gray-700')} border-2 ${team.colors.border} shadow-sm z-0">
                        🪙 ${team.score}/${targetScore}
                    </div>
                `;

                const jarContainer = document.createElement('div');
                jarContainer.className = 'jar-container';

                const jarLip = document.createElement('div');
                jarLip.className = 'jar-lip';
                
                const jarBack = document.createElement('div');
                jarBack.className = 'jar-back';

                const jarFront = document.createElement('div');
                jarFront.className = 'jar-front';

                const stack = document.createElement('div');
                stack.className = 'coin-stack';
                
                // Add coins to stack
                for(let i=0; i<team.score; i++) {
                    const coin = document.createElement('div');
                    coin.className = 'coin';
                    coin.innerText = i+1;
                    stack.appendChild(coin);
                }
                
                jarContainer.appendChild(jarBack);
                jarContainer.appendChild(stack);
                jarContainer.appendChild(jarFront);
                jarContainer.appendChild(jarLip);
                
                scoreArea.appendChild(jarContainer);

                // Question Area
                const questionArea = document.createElement('div');
                questionArea.id = `question-area-${team.id}`;
                questionArea.className = 'bg-white p-5 mx-3 mb-3 rounded-3xl shadow-inner border-4 border-gray-100 flex-grow-0 flex flex-col relative z-20';
                
                if (!isFinished && gameActive) {
                    questionArea.innerHTML = `
                        <div class="text-sm font-bold text-white bg-gray-800 rounded-full px-4 py-1 inline-block w-max mx-auto mb-3 shadow-md">
                            🎯 SOAL ${team.questionIndex + 1}
                        </div>
                        <div class="text-base sm:text-lg md:text-xl font-bold text-gray-800 text-center flex-grow flex items-center justify-center min-h-[90px] px-2 leading-relaxed">
                            "${q.text}"
                        </div>
                        <div class="grid grid-cols-2 gap-3 mt-5">
                            <button onclick="submitAnswer(${team.id}, true)" class="w-full bg-green-400 hover:bg-green-500 text-white font-fun py-3 rounded-2xl btn-hover-effect border-b-8 border-green-600 text-2xl shadow-sm">BENAR</button>
                            <button onclick="submitAnswer(${team.id}, false)" class="w-full bg-red-400 hover:bg-red-500 text-white font-fun py-3 rounded-2xl btn-hover-effect border-b-8 border-red-600 text-2xl shadow-sm">SALAH</button>
                        </div>
                    `;
                } else if (isFinished && gameActive) {
                    questionArea.innerHTML = `
                        <div class="text-center font-fun text-gray-400 text-2xl py-8">
                            🏁 Soal Habis!
                        </div>
                    `;
                }

                teamPanel.appendChild(header);
                teamPanel.appendChild(scoreArea);
                teamPanel.appendChild(questionArea);
                
                board.appendChild(teamPanel);
            });
        }

        function submitAnswer(teamId, givenAnswer) {
            if(!gameActive) return;

            const team = teams[teamId];
            const currentQ = shuffledQuestions[team.questionIndex];
            const isCorrect = givenAnswer === currentQ.answer;

            const questionArea = document.getElementById(`question-area-${team.id}`);

            if (isCorrect) {
                // Correct logic
                playCoinSound();
                team.score++;
                questionArea.classList.add('correct-animation');
                
                setTimeout(() => {
                    if(questionArea) questionArea.classList.remove('correct-animation');
                }, 300);

            } else {
                // Wrong logic
                questionArea.classList.add('shake-animation');
                
                setTimeout(() => {
                    if(questionArea) questionArea.classList.remove('shake-animation');
                }, 400);
            }

            team.questionIndex++;

            // Check Win Condition
            if (team.score >= targetScore) {
                gameActive = false;
                // Render one last time to show final coin before popping modal
                renderGameBoard();
                setTimeout(() => {
                    showWinner(team);
                }, 500);
                return;
            }

            // Normal re-render for this specific panel to feel fast, 
            // but for simplicity and integrity we re-render whole board (it's fast enough)
            renderGameBoard();
        }

        function showWinner(winningTeam) {
            document.getElementById('game-screen').classList.remove('flex');
            document.getElementById('game-screen').classList.add('hidden');
            
            const winnerScreen = document.getElementById('winner-screen');
            winnerScreen.classList.remove('hidden');
            
            const winnerName = document.getElementById('winner-name');
            winnerName.innerText = `${winningTeam.name} Menang!`;
            
            // Add fun particle effect (basic CSS workaround)
            createConfetti();
        }

        function resetGame() {
            gameActive = false;
            document.getElementById('game-screen').classList.remove('flex');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('winner-screen').classList.add('hidden');
            
            document.getElementById('setup-screen').classList.remove('hidden');
            
            // Cleanup confetti if exists
            const existingConfetti = document.querySelectorAll('.confetti');
            existingConfetti.forEach(e => e.remove());
        }

        function createConfetti() {
            const colors = ['#fde047', '#4ade80', '#60a5fa', '#f87171', '#c084fc'];
            for(let i=0; i<50; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti absolute z-50';
                conf.style.width = Math.random() * 10 + 5 + 'px';
                conf.style.height = Math.random() * 10 + 5 + 'px';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.top = -20 + 'px';
                conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                
                // Animation settings
                const duration = Math.random() * 3 + 2;
                const delay = Math.random() * 2;
                
                conf.style.animation = `fall ${duration}s linear ${delay}s infinite`;
                document.body.appendChild(conf);
            }
            
            // Add styles for confetti fall if not exist
            if(!document.getElementById('confetti-style')) {
                const style = document.createElement('style');
                style.id = 'confetti-style';
                style.innerHTML = `
                    @keyframes fall {
                        0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
                        100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
                    }
                `;
                document.head.appendChild(style);
            }
        }
    </script>
</body>
</html>

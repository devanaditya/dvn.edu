<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dino Run – Game Hitung SD Kelas 3</title>
<style>
*{box-sizing:border-box;margin:0;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;background:#173d24;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#2b1d0e}
#app{--s:clamp(90px,24vw,170px);display:flex;flex-direction:column;height:100dvh;max-width:920px;margin:auto;position:relative;overflow:hidden;background:#fff6dc}
#stage{position:relative;flex:1;min-height:210px;overflow:hidden;background:linear-gradient(#7fd0f5 0%,#d4f2ff 62%)}
#sun{position:absolute;right:6%;top:14%;font-size:44px}
#ground{position:absolute;left:0;right:0;bottom:0;height:26%;z-index:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.09) 0 40px,transparent 40px 80px),linear-gradient(#5eae45,#3d8a34 60%,#6b4a2b 60%);animation:gr 1s linear infinite}
@keyframes gr{to{background-position:-160px 0,0 0}}
.layer{position:absolute;left:0;white-space:nowrap;width:max-content;line-height:1;animation:sc linear infinite}
@keyframes sc{to{transform:translateX(-50%)}}
.layer span{display:inline-block}
#L0{top:6%;font-size:40px;opacity:.85;animation-duration:90s}
#L1{bottom:24%;font-size:46px;opacity:.65;filter:saturate(.8);animation-duration:45s;z-index:1}
#L2{bottom:16%;font-size:84px;animation-duration:15s;z-index:1}
#L3{bottom:1%;font-size:30px;animation-duration:5s;z-index:4}
.still .layer,.still #ground{animation-play-state:paused}
#snd{position:absolute;top:6px;right:6px;z-index:40;width:42px;height:42px;border-radius:50%;border:3px solid #fff;background:#fb5607;font-size:20px;line-height:1;padding:0;box-shadow:0 3px 0 #a83a02}
#hud{position:absolute;left:0;right:0;top:0;z-index:6;padding:8px 56px 8px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-weight:700;font-size:15px}
#hud .pill{background:#fffc;border-radius:14px;padding:3px 10px}
#bar{flex:1 1 100%;height:14px;background:#fff9;border-radius:8px;overflow:hidden;border:2px solid #fff}
#fill{height:100%;width:0;background:linear-gradient(90deg,#ffb703,#fb5607);transition:width .5s}
#hud .sp{flex:1}
#hud button{border:0;font-weight:700;font-size:15px;color:#2b1d0e;cursor:pointer}
#trex,#hero{position:absolute;bottom:11%;z-index:3}
#trex{width:calc(var(--s)*1.15);scale:-1 1;transition:left 1s ease-out}
#trex.lunge{animation:lunge .7s}
#trex.closein{transition:left 1.2s cubic-bezier(.55,0,.25,1)}
#trex.eat{z-index:4}
#trex.chomp{animation:chomp .8s ease-in-out}
@keyframes chomp{0%,100%{rotate:0deg}40%{rotate:7deg}65%{rotate:-3deg}}
#hero.caught{animation:grab 1.4s cubic-bezier(.5,0,.7,.4) forwards}
@keyframes grab{0%{translate:0 0;scale:1;rotate:0deg;opacity:1}30%{translate:8px -16px;scale:1.06;rotate:-8deg;opacity:1}100%{translate:40% -70%;scale:.25;rotate:-40deg;opacity:0}}
.spr{display:block;width:100%;aspect-ratio:var(--ar);background-size:calc(var(--n)*100%) 100%;background-repeat:no-repeat;animation:sp var(--d) steps(var(--n)) infinite}
@keyframes sp{to{background-position-x:calc(100%*var(--n)/(var(--n) - 1))}}
#rexs{--n:30;--ar:1.389;--d:1.5s}
#dino{--n:12;--ar:1.081;--d:.7s}
.still .spr{animation-play-state:paused}
@keyframes lunge{35%{translate:45px -8px}100%{translate:0 0}}
#hero{left:60%;width:calc(var(--s)*.6)}
#zilla{display:none;position:absolute;left:-45%;bottom:0;width:190%;scale:-1 1;animation:run .5s infinite}
#zilla.pop{animation:pop .7s cubic-bezier(.3,1.6,.5,1),run .5s .7s infinite}
@keyframes pop{from{scale:-.1 .1}to{scale:-1 1}}
@keyframes run{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
@keyframes hop{50%{transform:translateY(-34px)}}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#hero.hop{animation:hop .45s}
#hero.shk{animation:shake .4s}
#trex.hit{animation:hit 1.3s forwards}
@keyframes hit{15%{filter:brightness(4)}40%{filter:brightness(1.5) hue-rotate(80deg);translate:8px 0}60%{translate:-8px 0}100%{opacity:0;transform:translateY(-140px) rotate(-540deg) scale(.2)}}
#beam{display:none;position:absolute;z-index:5;height:18px;border-radius:9px;background:linear-gradient(90deg,#ff4d4d,#fff 55%,#8ff);box-shadow:0 0 18px 6px #ff4d4daa,0 0 34px 12px #6ef8;transform-origin:right center;scale:0 1}
#beam.fire{display:block;animation:bm .35s forwards}
@keyframes bm{to{scale:1 1}}
#msg{position:absolute;left:0;right:0;top:34%;text-align:center;z-index:7;font-size:clamp(24px,6vw,40px);font-weight:900;color:#fff;-webkit-text-stroke:2px #2b1d0e;paint-order:stroke fill;opacity:0;pointer-events:none}
#msg.show{animation:mg 1.3s}
#msg.bad{color:#ffd0d0}
@keyframes mg{0%{opacity:0;transform:scale(.5)}15%{opacity:1;transform:scale(1.1)}80%{opacity:1}100%{opacity:0}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:8;pointer-events:none}
#flash.go{animation:fl .7s}
@keyframes fl{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
#panel{padding:8px 12px 12px;background:#fff6dc;border-top:5px solid #6b4a2b}
#qrow{display:flex;justify-content:center;align-items:center;gap:12px;font-size:clamp(28px,7.5vw,46px);font-weight:900;margin-bottom:8px}
#ans{min-width:3.4ch;text-align:center;background:#fff;border:4px solid #fb5607;border-radius:14px;padding:0 10px;color:#fb5607}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:340px;margin:auto}
button{font:inherit;cursor:pointer}
#pad button{height:clamp(42px,7.4vh,60px);font-size:26px;font-weight:900;border:0;border-radius:14px;background:#fff;color:#2b1d0e;box-shadow:0 5px 0 #c9a96b;transition:transform .05s}
#pad button:active{transform:translateY(4px);box-shadow:0 1px 0 #c9a96b}
#pad .ok{background:#3aa655;color:#fff;box-shadow:0 5px 0 #23703a}
#pad .del{background:#ffd9a0}
.ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;background:linear-gradient(#173d24cc,#173d24ee);overflow:auto}
.ov[hidden]{display:none}
.card{background:#fff6dc;border:5px solid #6b4a2b;border-radius:22px;padding:20px;max-width:400px;width:100%;text-align:center}
.card h1{font-size:28px;line-height:1.1;margin-bottom:6px;color:#3d8a34}
.card p{margin:6px 0}
.card input{width:100%;font:inherit;font-size:20px;padding:10px;border-radius:12px;border:3px solid #c9a96b;text-align:center;margin:6px 0 10px}
.sl{display:flex;align-items:center;gap:8px;margin:8px 0 2px}.sl input{flex:1;min-width:0;height:34px;accent-color:#fb5607;touch-action:pan-y}.sl .sec{width:44px;height:44px;padding:0;font-size:24px;line-height:1}.sr{display:flex;justify-content:space-between;margin:0 52px 14px;font-size:12px;color:#6b4a2b}
.opts{display:grid;gap:8px;margin:8px 0 14px}
.opt{padding:9px;border-radius:14px;border:3px solid #c9a96b;background:#fff;font-weight:700;font-size:16px}
.opt small{display:block;font-weight:400;font-size:13px;color:#6b4a2b}
.opt.sel{border-color:#fb5607;background:#ffe9d6}
.go{width:100%;padding:13px;font-size:22px;font-weight:900;border:0;border-radius:16px;background:#fb5607;color:#fff;box-shadow:0 5px 0 #a83a02}
.stats{display:flex;justify-content:space-around;margin:12px 0;font-weight:700}
.stats b{display:block;font-size:26px;color:#fb5607}
#pc{max-width:480px}
.sec{padding:10px;border-radius:14px;border:3px solid #c9a96b;background:#fff;font-weight:700;font-size:15px;color:#2b1d0e}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
#chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:-4px 0 10px}
#chips button{border:2px solid #c9a96b;background:#fff;border-radius:12px;padding:2px 9px;font-size:13px;font-weight:700}
.srow{display:flex;gap:6px;margin:6px 0}.srow .sec:first-child{flex:1;text-align:left}.srow .on{border-color:#3aa655;background:#e6f7ea}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:5px 3px;border-bottom:1px solid #e0cf9f;text-align:center}th{background:#f1e2b4}
@media(prefers-reduced-motion:reduce){.layer,#ground{animation-duration:200s}}
</style>
</head>
<body>
<div id="app">
 <div id="stage">
  <div id="sun">☀️</div>
  <div id="ground"></div>
  <div class="layer" id="L0"></div><div class="layer" id="L1"></div><div class="layer" id="L2"></div><div class="layer" id="L3"></div>
  <div id="hud">
   <button class="pill" id="home">🏠 Menu</button><span class="pill" id="hn"></span><span class="sp"></span>
   <span class="pill" id="hs">⭐ 0</span><span class="pill" id="hl">❤️❤️❤️</span>
   <div id="bar"><div id="fill"></div></div>
  </div>
  <div id="trex"><i class="spr" id="rexs"></i></div><div id="hero"><i class="spr" id="dino"></i><img id="zilla" alt="Godzilla"></div>
  <div id="beam"></div><div id="msg"></div><div id="flash"></div>
 </div>
 <div id="panel">
  <div id="qrow"><span id="q">–</span><span id="ans">?</span></div>
  <div id="pad"></div>
 </div>

 <div id="start" class="ov"><div class="card">
  <h1>🦕 Dino Run!</h1>
  <p>Larilah dari T-Rex dengan menjawab soal tambah, kurang, kali, dan bagi!</p>
  <p id="sl" style="font-size:14px;font-weight:700;color:#6b4a2b"></p><input id="nm" maxlength="12" placeholder="Tulis namamu" autocomplete="off"><div id="chips"></div>
  <p><b>Panjang permainan: <span id="gl"></span></b></p>
  <div class="sl"><button class="sec" id="gm">−</button><input type="range" id="gr" min="5" max="30" step="1" value="20" aria-label="Jumlah soal"><button class="sec" id="gp">+</button></div>
  <div class="sr"><span>5 soal</span><span>30 soal</span></div>
  <button class="go" id="go">Mulai Lari!</button>
  <div class="row2"><button class="sec" id="bset">⚙️ Atur Sesi</button><button class="sec" id="brk">🏆 Peringkat</button></div>
  <p style="font-size:13px;color:#6b4a2b">Benar +10 dan T-Rex menjauh. Salah 3 kali, kamu ditangkap!</p>
 </div></div>

 <div id="end" class="ov" hidden><div class="card">
  <h1 id="et"></h1><p id="ed"></p>
  <div class="stats"><div><b id="e1"></b>Skor</div><div><b id="e2"></b>Benar</div><div><b id="e3"></b>Salah</div></div>
  <p id="er" style="font-weight:700;margin-bottom:8px"></p><button class="go" id="again">Main Lagi</button>
  <button class="sec" id="erk" style="width:100%;margin-top:8px">🏆 Lihat Peringkat</button>
 </div></div>
 <button id="snd" aria-label="Suara">🔊</button>
 <div id="pop" class="ov" hidden style="z-index:30"><div class="card" id="pc"></div></div>
</div>

const stage=$('stage'),trex=$('trex'),hero=$('hero'),dino=$('dino'),zilla=$('zilla'),beam=$('beam'),msg=$('msg');
dino.style.backgroundImage=`url(${IMG.dino})`;$('rexs').style.backgroundImage=`url(${IMG.rex})`;zilla.src=IMG.zilla;

/* ---------- Bank 100 soal (tetap, dibuat sekali dengan angka acak berbenih) ---------- */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const BANK=(()=>{
 const r=rng(2026),ri=(a,b)=>a+Math.floor(r()*(b-a+1)),seen=new Set(),out=[];
 const push=(a,t,b,ans)=>{const k=a+t+b;if(ans<0||ans>999||seen.has(k))return false;seen.add(k);out.push({a,t,b,ans});return true};
 const gens={
  add:[()=>{const a=ri(10,99),b=ri(10,99);return[a,'+',b,a+b]},
       ()=>{const a=ri(100,899),b=ri(10,99);return[a,'+',b,a+b]},
       ()=>{const a=ri(100,600),b=ri(100,399);return[a,'+',b,a+b]}],
  sub:[()=>{const a=ri(30,99),b=ri(10,a-5);return[a,'−',b,a-b]},
       ()=>{const a=ri(100,999),b=ri(10,99);return[a,'−',b,a-b]},
       ()=>{const a=ri(300,999),b=ri(100,a-50);return[a,'−',b,a-b]}],
  mul:[()=>{const a=ri(11,99),b=ri(2,9);return[a,'×',b,a*b]},
       ()=>{const a=ri(11,50),b=ri(2,9);return[a,'×',b,a*b]},
       ()=>{const a=ri(3,9),b=ri(3,9);return[a,'×',b,a*b]}],
  div:[()=>{const b=ri(2,9),q=ri(Math.ceil(10/b),Math.floor(99/b));return[b*q,'÷',b,q]}]
 };
 const plan=[['add',55],['sub',55],['mul',50],['div',40]];
 plan.forEach(([k,n])=>{let c=0,i=0;while(c<n&&i++<2000){const g=gens[k][k==='mul'?(c%6===5?2:c%2):k==='div'?0:c%3]();if(push(...g))c++}});
 return out;
})();

$('L0').innerHTML=rep('☁️　　　　☁️　　　',8);

['1','2','3','4','5','6','7','8','9','⌫','0','✓'].forEach(k=>{

/* ---------- State ---------- */
let S={on:false,score:0,goal:200,wrong:0,G:30},goal=200,gen=0;
const later=(f,ms)=>{const g=gen;setTimeout(()=>{if(g===gen)f()},ms)};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const gr=$('gr'),setG=v=>{v=Math.max(5,Math.min(30,v));gr.value=v;goal=v*10;$('gl').textContent=`${v} soal (skor finish ${goal})`};
gr.oninput=()=>setG(+gr.value);$('gm').onclick=()=>setG(+gr.value-1);$('gp').onclick=()=>setG(+gr.value+1);setG(20);
$('go').onclick=start;$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')start()});
$('home').onclick=()=>{gen++;S.on=false;$('end').hidden=true;$('start').hidden=false};
$('again').onclick=()=>{$('end').hidden=true;$('start').hidden=false;refreshStart()};

function start(){
 const bank=BANK.slice();for(let i=bank.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bank[i],bank[j]]=[bank[j],bank[i]]}
 duck(1);gen++;S={on:true,t0:Date.now(),lock:false,name:$('nm').value.trim()||'Ayam Kecil',goal,score:0,correct:0,wrong:0,G:30,bank,qi:0,ans:''};
 stage.classList.remove('still');hero.className='';trex.className='';trex.style.animation='';dino.style.display='block';dino.style.animation='';
 zilla.style.display='none';zilla.className='';beam.className='';
 $('hn').textContent='🐔 '+S.name;$('start').hidden=true;$('end').hidden=true;
 update();next();
}
function update(){
 trex.style.left=S.wrong>=3?'calc(60% - var(--s)*.88)':`calc(60% - var(--s) - ${S.G*.55}%)`;
 if(S.wrong>=3)trex.classList.add('closein','eat');
 $('hs').textContent=`⭐ ${S.score} / ${S.goal}`;
 $('hl').textContent='❤️'.repeat(3-S.wrong)+'🖤'.repeat(S.wrong);
 $('fill').style.width=Math.min(100,S.score/S.goal*100)+'%';
}
function next(){
 S.lock=false;S.ans='';S.q=S.bank[S.qi++%S.bank.length];
 $('q').textContent=`${S.q.a} ${S.q.t} ${S.q.b} =`;show();
}
function show(){$('ans').textContent=S.ans||'?'}
function say(t,c){msg.textContent=t;msg.className='';void msg.offsetWidth;msg.className='show '+(c||'')}
function anim(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}

function press(k){
 if(!S.on||S.lock)return;
 if(k==='⌫')S.ans=S.ans.slice(0,-1);
 else if(k==='✓')return check();
 else if(S.ans.length<3){S.ans+=k;sfx('tap')}
 show();
}
document.addEventListener('keydown',e=>{
 if(!S.on||$('start').hidden===false)return;
 if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('⌫');else if(e.key==='Enter')press('✓');
});

function check(){
 if(S.ans==='')return;
 S.lock=true;const ok=+S.ans===S.q.ans;sfx(ok?'ok':'bad');

 if(AU.ctx)m?AU.ctx.suspend():AU.ctx.resume();
}
$('snd').onclick=()=>{audioInit();setMute(!AU.muted)};
const wake=()=>{audioInit();if(AU.ctx&&AU.ctx.state==='suspended'&&!AU.muted)AU.ctx.resume()};
document.addEventListener('pointerdown',wake);document.addEventListener('keydown',wake);
document.addEventListener('visibilitychange',()=>{if(!AU.ctx)return;document.hidden?AU.ctx.suspend():(!AU.muted&&AU.ctx.resume())});
setMute(AU.muted);

update();refreshStart();
</script>
</body>

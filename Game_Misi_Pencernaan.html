<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Petualangan Sebutir Nasi: Misi Pencernaan</title>
<style>
:root{--n0:#0b2a30;--n1:#0f3b44;--n2:#17525c;--red:#0f6b73;--redl:#79d2d6;--paper:#f3f7f7;--card:#fff;--ink:#14202f;--mut:#566679;--line:#d6dee9;--blue:#3b82f6;--yel:#f2c230;--ok:#1f8a55;--bad:#c0392b}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "Segoe UI","Helvetica Neue",Arial,sans-serif}
h1,h2,h3{margin:0;line-height:1.25;letter-spacing:-.01em}h2{font-size:1.55rem;font-weight:800}h3{font-size:1.08rem;font-weight:700;margin:0 0 6px}
p{margin:.45em 0}
.app{min-height:100vh}
.side{background:#e3edeb;border-bottom:1px solid #c6d8d5;position:sticky;top:0;z-index:30;padding:10px max(14px,calc((100% - 1040px)/2)) 9px}
.brand{display:flex;gap:11px;align-items:center;padding:0 0 9px}
.brand .mk{flex:0 0 38px;height:38px;border-radius:11px;background:var(--n1);display:grid;place-items:center}
.brand .mk svg{width:22px;height:22px}
.brand b{display:block;font-size:1.05rem;line-height:1.2;font-weight:800;color:var(--n0)}
.brand span{display:block;font-size:.78rem;color:#44636a;line-height:1.3}
nav{display:flex;flex-direction:row;gap:6px;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin}
nav button{flex:0 0 auto;display:flex;align-items:center;gap:8px;white-space:nowrap;background:#fff;border:1px solid #c0d3d0;border-radius:999px;color:#17454d;font:600 .92rem/1.2 inherit;font-family:inherit;padding:8px 14px;cursor:pointer}
nav button svg{width:19px;height:19px;flex:0 0 19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{background:#f2f8f7}
nav button[aria-selected=true]{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 2px 6px rgba(15,107,115,.3)}
main{max-width:960px;margin:0 auto;padding:22px 14px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:16px 0}
.lead{color:var(--mut);margin:6px 0 0}
ul.tj{margin:8px 0 0;padding-left:1.2em}ul.tj li{margin:.35em 0}
.flow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;padding:0;list-style:none;counter-reset:s}
.flow li{counter-increment:s;background:var(--n1);color:#e6edf7;border-radius:8px;padding:8px 12px;font-size:.92rem}
.flow li::before{content:counter(s)". ";color:var(--redl);font-weight:800}
.btn{font:700 1rem/1 inherit;font-family:inherit;border:0;border-radius:9px;padding:12px 18px;background:var(--red);color:#fff;cursor:pointer}
.btn.alt{background:var(--n1)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,nav button:focus-visible{outline:3px solid #7fb0ff;outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
table.t{border-collapse:collapse;width:100%;font-size:.93rem}table.t th,table.t td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}table.t th{background:#e6edf6}
.tw{overflow-x:auto}
.note{font-size:.9rem;color:var(--mut)}
.warn{background:#fff6e5;border-left:4px solid #e0a100;padding:10px 14px;border-radius:6px;font-size:.93rem}
.info{background:#e8f1fc;border-left:4px solid var(--blue);padding:10px 14px;border-radius:6px;font-size:.93rem}
.cells4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;text-align:center}
.cells4 svg{width:100%;max-width:130px;height:auto}.cells4 p{font-size:.85rem;margin:0;line-height:1.35}
.legend{font-size:.85rem;color:var(--mut);text-align:center;margin-top:6px}
.kit{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;padding:0;list-style:none;margin:8px 0 0}
.kit li{background:#f2f6fb;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.92rem}
ol.st{padding-left:0;list-style:none;counter-reset:n;margin:8px 0 0}
ol.st li{counter-increment:n;display:grid;grid-template-columns:34px 1fr;gap:10px;margin:10px 0}
ol.st li::before{content:counter(n);background:var(--red);color:#fff;font-weight:800;width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
/* simulasi */
.sim{display:grid;gap:14px}
.rack{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.tube{background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 2px 4px;cursor:pointer;font:600 .78rem/1.2 inherit;font-family:inherit;color:var(--ink);position:relative;text-align:center}
.tube svg{width:26px;height:70px;display:block;margin:0 auto 2px}
.tube[aria-pressed=true]{border-color:var(--red);background:#e6f4f4;box-shadow:0 0 0 2px rgba(15,107,115,.25)}
.tube .ck{position:absolute;top:3px;right:4px;color:var(--ok);font-size:.8rem;font-weight:800}
.bench{background:linear-gradient(160deg,var(--n1),var(--n2));border-radius:14px;padding:16px;color:#dbe4f2}
.slide{background:rgba(190,215,240,.13);border:1px solid rgba(190,215,240,.5);border-radius:12px;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.04)}
.wellwrap{text-align:center}.wellwrap svg{display:block;width:100%;max-width:190px;height:auto;margin:0 auto}
.tag{display:block;width:max-content;margin:6px auto 0;font-weight:800;padding:2px 12px;border-radius:12px;font-size:.92rem;color:#0a101d}
.bl{transition:opacity .6s,fill 1.6s}.dr{transition:opacity .6s}
.cells circle{transition:transform 2.6s cubic-bezier(.4,0,.2,1),opacity .6s}
.cells.stir{animation:swirl 1.6s ease-in-out}
@keyframes swirl{to{transform:rotate(360deg)}}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.status{margin:12px 0 0;min-height:1.6em;color:#f1f5fb;font-weight:600}
.bar{height:6px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:var(--redl);transition:width 2.8s linear}
/* kartu catat */
.rc{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}
.rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.chip{font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:12px;background:#e8edf4;color:var(--mut)}.chip.on{background:#dff3e8;color:var(--ok)}
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:8px}
.rg label{font-size:.8rem;color:var(--mut);display:block}
select,textarea,input{width:100%;font:inherit;font-size:.95rem;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px;background:#fff}
select:disabled{background:#f1f3f6;color:#9aa6b4}
textarea{resize:vertical}
.ok{border-color:var(--ok)!important;background:#e9f6ef!important}.bad{border-color:var(--bad)!important;background:#fdecea!important}
.cards2{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
.idg{display:grid;grid-template-columns:2fr 1fr 90px;gap:10px}.idg label{font-size:.85rem;color:var(--mut)}
.q{margin:12px 0}.q label{font-weight:600;display:block;margin-bottom:4px}
/* evaluasi */
.dots{display:flex;gap:5px;margin:8px 0 14px}.dots i{flex:1;height:8px;border-radius:4px;background:#d6dee9}.dots i.c{background:var(--ok)}.dots i.w{background:var(--bad)}.dots i.n{background:var(--blue)}
.opt{display:block;width:100%;text-align:left;font:inherit;font-family:inherit;background:#fff;border:2px solid var(--line);border-radius:10px;padding:11px 14px;margin:8px 0;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--blue)}.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:#e9f6ef}.opt.wrong{border-color:var(--bad);background:#fdecea}
.opt b{display:inline-block;width:1.6em}
.fb{border-radius:10px;padding:12px 14px;margin-top:10px}.fb.right{background:#e9f6ef;border-left:4px solid var(--ok)}.fb.wrong{background:#fdecea;border-left:4px solid var(--bad)}
.score{font-size:3rem;font-weight:800;line-height:1}
#sheet{display:none}
@media(max-width:620px){h2{font-size:1.3rem}.brand span{display:none}.brand{padding-bottom:7px}nav button{padding:7px 12px;font-size:.86rem}.rack{grid-template-columns:repeat(4,1fr)}.cells4{grid-template-columns:repeat(2,1fr)}.idg{grid-template-columns:1fr 1fr}.idg div:first-child{grid-column:1/3}.bench{padding:10px}.slide{padding:8px;gap:6px}.cards2{grid-template-columns:1fr}.card{padding:14px}}
@media(prefers-reduced-motion:reduce){.cells circle,.bl,.bar i{transition:none}.cells.stir{animation:none}}

.side{padding-left:max(14px,calc((100% - 1200px)/2));padding-right:max(14px,calc((100% - 1200px)/2))}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100}
.big{font-size:3.2rem;line-height:1}
.res{text-align:center}.res h2{margin:6px 0}.res p{margin:6px 0}
.intro{display:flex;gap:16px;align-items:center}.intro .big{flex:0 0 auto}
.bdg{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.map{position:relative;max-width:480px;margin:0 auto;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.map img{display:block;width:100%;height:auto}
.hot{position:absolute;width:46px;height:46px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid var(--red);background:rgba(15,107,115,.08);cursor:pointer;padding:0;animation:pulse 2s infinite}
.hot.bn{border-color:#c98f00;color:#7a5600;font-weight:800;font-size:1.1rem;background:rgba(242,194,48,.4);width:34px;height:34px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(15,107,115,.55)}70%{box-shadow:0 0 0 14px rgba(15,107,115,0)}100%{box-shadow:0 0 0 0 rgba(15,107,115,0)}}
.hot:hover{background:rgba(15,107,115,.25)}
.olist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}.btn.sm{padding:7px 12px;font-size:.88rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.slot{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border:2px dashed #b9cccd;border-radius:10px;background:#f6f9f9;cursor:pointer;font:inherit;font-family:inherit;color:var(--ink)}.slot.f{border:2px solid var(--red);background:#e6f4f4}
.ar{text-align:center;color:#8aa0a2;font-size:.85rem;line-height:1.2;margin:2px 0}
.pool{display:flex;flex-wrap:wrap;gap:8px}.e{font-size:1.3rem}
.fbm{min-height:1.4em;margin-top:10px;color:var(--bad);font-weight:600}
.btn.big2{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 10px;width:100%}.btn.big2 b{font-size:1.2rem}.btn.big2 span{font-size:.82rem;opacity:.9;font-weight:600}
.ovl{position:fixed;inset:0;background:rgba(10,30,34,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.mbox{position:relative;background:#fff;border-radius:16px;padding:24px;max-width:420px;width:100%;text-align:center}
.mi{font-size:3.2rem;line-height:1}.mbox h3{font-size:1.4rem;margin:8px 0}.mbox p{margin:12px 0}
.mx{position:absolute;top:8px;right:12px;background:none;border:0;font-size:1.8rem;color:#7a8b8d;cursor:pointer}
@media(max-width:620px){.two{grid-template-columns:1fr}.two.k2{grid-template-columns:1fr 1fr}.intro{flex-direction:column;text-align:center}}
@media(prefers-reduced-motion:reduce){.hot{animation:none}}

{q:'Di mana sari-sari makanan diserap agar kita punya energi?',o:['Usus halus','Kerongkongan','Anus'],k:0,e:'Penyerapan nutrisi ke darah terjadi di usus halus.'},
{q:'Mengunyah makanan dengan gigi termasuk pencernaan …',o:['kimiawi','mekanik','ajaib'],k:1,e:'Gigi memotong dan menghancurkan makanan secara fisik tanpa mengubah zatnya, jadi mekanik.'},
{q:'Air liur yang melunakkan makanan di mulut termasuk pencernaan …',o:['kimiawi','mekanik','otomatis'],k:0,e:'Air liur mengandung enzim yang mengubah zat makanan, jadi kimiawi.'},
{q:'Gerakan otot kerongkongan yang mendorong makanan disebut …',o:['peristaltik','akrobatik','atletik'],k:0,e:'Gerak peristaltik adalah remasan otot bergantian yang mendorong makanan.'}];
const PROC=[
{t:'Mengunyah pakai gigi',k:'mekanik'},{t:'Air liur melunakkan roti',k:'kimiawi'},{t:'Otot kerongkongan meremas',k:'mekanik'},
{t:'Asam lambung menghancurkan kuman',k:'kimiawi'},{t:'Lambung mengaduk-aduk makanan',k:'mekanik'},{t:'Enzim pankreas memecah nutrisi',k:'kimiawi'}];

/* simpanan lencana */
const K='misi-pencernaan-v1';let G={badges:[],best:0};
try{G=Object.assign(G,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const saveG=()=>{try{localStorage.setItem(K,JSON.stringify(G))}catch(e){}};
const badge=n=>{if(!G.badges.includes(n)){G.badges.push(n);saveG()}};

/* menu atas */
const TABS=[
['tujuan','<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>','Tujuan'],
['eksplorasi','<path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11zM12 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/>','Eksplorasi'],
['urutkan','<path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/>','Urutkan'],
['fungsi','<path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9.6 9.5a2.4 2.4 0 1 1 3.4 2.2c-.7.4-1 .9-1 1.8M12 17h.01"/>','Tebak fungsi'],
['mekanik','<path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/>','Mekanik vs kimiawi'],
['tantangan','<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>','Tantangan'],
['pengembang','<path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 3.5-6 8-6s8 2 8 6"/>','Pengembang'],
['referensi','<path d="M6 3h12v18l-6-4-6 4z"/>','Referensi']];
$('#tabs').innerHTML=TABS.map(t=>`<button role="tab" id="t-${t[0]}" aria-selected="false" data-go="${t[0]}"><svg viewBox="0 0 24 24" aria-hidden="true">${t[1]}</svg><span>${t[2]}</span></button>`).join('');
let cur='tujuan',T={};
function go(t){cur=t;T={};TABS.forEach(x=>$('#t-'+x[0]).setAttribute('aria-selected',x[0]===t));try{history.replaceState(null,'','#'+t)}catch(e){}window.scrollTo(0,0);$('#t-'+t).scrollIntoView({inline:'center',block:'nearest'});render()}
const V={};function render(){V[cur]()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});
const nextOf=t=>t==='tantangan'?'tujuan':TABS[TABS.findIndex(x=>x[0]===t)+1][0];

/* modal */
function openModal(icon,title,tag,desc){$('#mi').textContent=icon;$('#mt').textContent=title;$('#mtag').innerHTML=tag?`<span class="chip on">${tag}</span>`:'';$('#md').textContent=desc;$('#modal').hidden=false;$('#mok').focus()}
const closeModal=()=>{$('#modal').hidden=true};
$('#mclose').onclick=closeModal;$('#mok').onclick=closeModal;$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

/* hasil umum */
function hasil(icon,title,text,extra,again){return`<div class="card hs res"><div class="big" aria-hidden="true">${icon}</div><h2>${title}</h2><p>${text}</p>${extra||''}<div class="row" style="justify-content:center"><button class="btn" data-go="${again}">Main lagi</button><button class="btn alt" data-go="${nextOf(again)}">Misi berikutnya</button><button class="btn ghost" data-go="tujuan">Ke Tujuan</button></div></div>`}

/* Tujuan */
V.tujuan=()=>{$('#view').innerHTML=`<h2>Tujuan Pembelajaran</h2>
<p class="lead">Alur tujuan pembelajaran Bab 2: <i>menganalisis struktur dan fungsi organ-organ sistem pencernaan manusia serta gangguannya.</i> Game ini melatih bagian struktur dan fungsi organ pencernaan.</p>
<div class="card hs"><div class="intro"><div class="big" aria-hidden="true">🍚</div><div><h3>Halo, teman-teman!</h3><p>Namaku <b>Bulo</b>, sebutir nasi yang siap berpetualang di dalam tubuhmu. Ikuti perjalananku dan selesaikan misinya.</p></div></div></div>
<div class="card"><h3>Setelah bermain, kamu mampu:</h3><ul class="tj">
<li>menyebutkan organ pencernaan secara berurutan dari mulut sampai anus;</li>
<li>menjelaskan fungsi tiap organ pencernaan;</li>
<li>membedakan pencernaan mekanik dan pencernaan kimiawi.</li></ul></div>
<div class="card"><h3>Cara bermain</h3><ol class="st">
<li><div><b>Eksplorasi:</b> ketuk titik pada peta tubuh untuk membaca tiap organ.</div></li>
<li><div><b>Urutkan:</b> susun organ sesuai jalur makanan.</div></li>
<li><div><b>Tebak fungsi:</b> pilih tugas yang tepat untuk organ yang muncul.</div></li>
<li><div><b>Mekanik vs kimiawi:</b> kelompokkan tiap proses pencernaan.</div></li>
<li><div><b>Tantangan:</b> kuis campuran untuk mendapat bintang.</div></li></ol>
<div class="row"><button class="btn" data-go="eksplorasi">Mulai dari Eksplorasi</button></div></div>
<div class="card"><h3>Lencanamu</h3>${G.badges.length?`<div class="bdg">${G.badges.map(b=>`<span class="chip on">🏅 ${b}</span>`).join('')}</div><p class="note">Bintang terbaik di Tantangan: ${G.best?'⭐'.repeat(G.best):'belum ada'}</p>`:'<p class="note">Belum ada lencana. Selesaikan misi untuk mengumpulkannya.</p>'}
${G.badges.length?'<div class="row"><button class="btn ghost" id="rstg">Hapus lencana</button></div>':''}</div>`;
 const r=$('#rstg');if(r)r.onclick=()=>{if(confirm('Hapus semua lencana dan bintang?')){G={badges:[],best:0};saveG();V.tujuan()}}};

/* Eksplorasi */
V.eksplorasi=()=>{$('#view').innerHTML=`<h2>Peta Petualangan</h2><p class="lead">Ketuk lingkaran pada gambar, atau pilih nama organ di bawahnya, untuk membaca informasinya.</p>
<div class="card"><div class="map"><img src="${IMG}" alt="Ilustrasi sistem pencernaan manusia dengan organ bernomor 1 sampai 6">
${ORGAN.map(o=>`<button class="hot ${o.bonus?'bn':''}" style="left:${o.x}%;top:${o.y}%" data-o="${o.id}" aria-label="${o.name}">${o.bonus?'★':''}</button>`).join('')}</div>
<div class="olist">${ORGAN.map(o=>`<button class="btn ghost sm" data-o="${o.id}">${o.bonus?'★':o.id+'.'} ${o.name}</button>`).join('')}</div>
<p class="note">Tanda ★ menunjukkan organ pendukung: hati dan pankreas.</p></div>
<div class="row"><button class="btn" data-go="urutkan">Lanjut ke Urutkan</button></div>`;
 $$('[data-o]').forEach(b=>b.onclick=()=>{const o=ORGAN.find(x=>x.id==b.dataset.o);openModal(o.emoji,o.name,'Analogi: '+o.analogy,o.desc)})};

/* Urutkan */
V.urutkan=()=>{if(!T.pool){T.pool=sh(MAIN);T.slots=Array(6).fill(null);T.msg=''}
 const {pool,slots}=T;
 $('#view').innerHTML=`<h2>Urutkan Perjalanan</h2><p class="lead">Ketuk organ untuk menaruhnya di jalur dari atas ke bawah. Ketuk organ di jalur untuk mengembalikannya.</p>
<div class="two"><div class="card"><h3>Jalur makanan</h3>${slots.map((o,i)=>`<button class="slot ${o?'f':''}" data-s="${i}" aria-label="urutan ke-${i+1}${o?': '+o.name:' kosong'}">${o?`<span class="e">${o.emoji}</span><b>${o.name}</b>`:`<span class="note">Urutan ke-${i+1}</span>`}</button>${i<5?'<div class="ar" aria-hidden="true">↓</div>':''}`).join('')}</div>
<div class="card"><h3>Pilih organ</h3><div class="pool">${pool.map(o=>`<button class="btn ghost" data-p="${o.id}"><span class="e">${o.emoji}</span> ${o.name}</button>`).join('')||'<p class="note">Semua organ sudah dipilih.</p>'}</div>
<div class="row"><button class="btn" id="cekU" ${pool.length?'disabled':''}>Cek jawaban</button></div><p class="fbm" role="status">${T.msg}</p></div></div>`;
 $$('[data-p]').forEach(b=>b.onclick=()=>{const i=T.pool.findIndex(o=>o.id==b.dataset.p),o=T.pool.splice(i,1)[0],e=T.slots.indexOf(null);if(e>-1)T.slots[e]=o;T.msg='';V.urutkan()});
 $$('[data-s]').forEach(b=>b.onclick=()=>{const i=+b.dataset.s,o=T.slots[i];if(o){T.slots[i]=null;T.pool.push(o);T.msg='';V.urutkan()}});
 $('#cekU').onclick=()=>{if(T.slots.every((o,i)=>o&&o.id===i+1)){badge('Ahli Rute');fire();$('#view').innerHTML=hasil('🎉','Hebat sekali!','Kamu menyusun jalur pencernaan dengan sempurna. Lencana “Ahli Rute” kamu dapatkan.','<p class="note">Mulut → Kerongkongan → Lambung → Usus halus → Usus besar → Anus</p>','urutkan')}
  else{T.pool=sh(MAIN);T.slots=Array(6).fill(null);T.msg='Urutannya belum tepat. Ingat: mulut, kerongkongan, lambung, usus halus, usus besar, anus. Susun lagi dari awal.';V.urutkan()}}};

/* Kuis generik dengan umpan balik langsung (gaya sama dengan Evaluasi di lab maya) */
V.fungsi=()=>{if(T.i===undefined){T.i=0;T.sc=0;T.q=sh(MAIN);T.a=null}
 if(T.i>=T.q.length){badge('Si Paling Tahu');fire();$('#view').innerHTML=hasil('🏆','Misi selesai!',`Kamu menjawab benar ${T.sc} dari ${T.q.length}. Lencana “Si Paling Tahu” kamu dapatkan.`,'','fungsi');return}
 const o=T.q[T.i];if(!T.opts){T.opts=sh([o.fungsi,...sh(MAIN.filter(x=>x.id!==o.id).map(x=>x.fungsi)).slice(0,2)])}
 const ans=T.a;
 $('#view').innerHTML=`<h2>Tebak Fungsi</h2>${dots(T.q.length,T.i,T.res)}<p class="note">Soal ${T.i+1} dari ${T.q.length} · Benar: ${T.sc}</p>
<div class="card hs res"><div class="big" aria-hidden="true">${o.emoji}</div><h3 style="font-size:1.4rem">${o.name}</h3><p class="note">“Apa tugas utamaku?”</p></div>
<div class="card">${T.opts.map((t,i)=>`<button class="opt ${ans!==null?(t===o.fungsi?'right':(i===ans?'wrong':'')):''}" data-i="${i}" ${ans!==null?'disabled':''}>${t}</button>`).join('')}
${ans!==null?`<div class="fb ${T.opts[ans]===o.fungsi?'right':'wrong'}" role="status"><b>${T.opts[ans]===o.fungsi?'Benar!':'Belum tepat.'}</b> ${T.opts[ans]===o.fungsi?'':'Tugas utama '+o.name.toLowerCase()+': <b>'+o.fungsi+'</b>. '}${o.desc}</div><div class="row"><button class="btn" id="nx">${T.i===T.q.length-1?'Lihat hasil':'Soal berikutnya'}</button></div>`:''}</div>`;
 $$('.opt').forEach(b=>b.onclick=()=>{if(T.a!==null)return;T.a=+b.dataset.i;const ok=T.opts[T.a]===o.fungsi;if(ok)T.sc++;(T.res=T.res||[])[T.i]=ok;V.fungsi()});
 const nx=$('#nx');if(nx)nx.onclick=()=>{T.i++;T.a=null;T.opts=null;V.fungsi();window.scrollTo(0,0)}};
const dots=(n,i,res)=>`<div class="dots" aria-hidden="true">${Array.from({length:n},(_,k)=>`<i class="${res&&res[k]!==undefined?(res[k]?'c':'w'):(k===i?'n':'')}"></i>`).join('')}</div>`;

/* Mekanik vs kimiawi */
V.mekanik=()=>{if(!T.q){T.q=sh(PROC);T.fb=null;T.tot=PROC.length}
 if(!T.q.length){badge('Ilmuwan Perut');fire();$('#view').innerHTML=hasil('🔬','Luar biasa!','Kamu berhasil membedakan proses mekanik dan kimiawi. Lencana “Ilmuwan Perut” kamu dapatkan.','','mekanik');return}
 const p=T.q[0],fb=T.fb;
 $('#view').innerHTML=`<h2>Mekanik vs Kimiawi</h2><p class="lead">Pilih jenis pencernaan yang tepat untuk proses berikut. Proses yang salah akan muncul lagi nanti.</p>
<div class="card hs res"><h3 style="font-size:1.35rem">“${p.t}”</h3><p class="note">Sisa: ${T.q.length} proses</p></div>
<div class="two k2"><button class="btn big2" data-k="mekanik" ${fb?'disabled':''}><b>Mekanik</b><span>gerakan, remas, aduk</span></button><button class="btn big2 alt" data-k="kimiawi" ${fb?'disabled':''}><b>Kimiawi</b><span>cairan, asam, enzim</span></button></div>
${fb?`<div class="card"><div class="fb ${fb.ok?'right':'wrong'}" role="status"><b>${fb.ok?'Tepat sekali!':'Belum tepat.'}</b> Ini pencernaan <b>${p.k}</b>: ${p.k==='mekanik'?'melibatkan gerakan fisik seperti memotong, meremas, atau mengaduk tanpa mengubah zat makanan.':'memakai zat khusus seperti air liur, asam, atau enzim untuk mengubah zat makanan.'}</div><div class="row"><button class="btn" id="nx">Lanjut</button></div></div>`:''}`;
 $$('[data-k]').forEach(b=>b.onclick=()=>{if(T.fb)return;T.fb={ok:b.dataset.k===p.k};V.mekanik()});
 const nx=$('#nx');if(nx)nx.onclick=()=>{const it=T.q.shift();if(!T.fb.ok)T.q.push(it);T.fb=null;V.mekanik()}};

/* Tantangan */
V.tantangan=()=>{if(T.i===undefined){T.i=0;T.sc=0;T.q=sh(QUIZ);T.a=null}
 if(T.i>=T.q.length){const n=T.q.length,s=T.sc,st=s===n?3:(s>=n-2?2:1);if(st===3)badge('Master Bintang 3');G.best=Math.max(G.best,st);saveG();fire();
  $('#view').innerHTML=hasil('⭐'.repeat(st),'Hasil tantangan',st===3?'Sempurna! Kamu master pencernaan.':st===2?'Bagus sekali, hampir sempurna.':'Usaha yang bagus. Pelajari lagi misi sebelumnya agar makin jago.',`<p class="note">Skor kamu: ${s} dari ${n}</p>`,'tantangan');return}
 const q=T.q[T.i],ans=T.a;
 $('#view').innerHTML=`<h2>Tantangan Bintang</h2>${dots(T.q.length,T.i,T.res)}<p class="note">Soal ${T.i+1} dari ${T.q.length}</p>
<div class="card"><h3 style="font-size:1.15rem">${q.q}</h3>${q.o.map((t,i)=>`<button class="opt ${ans!==null?(i===q.k?'right':(i===ans?'wrong':'')):''}" data-i="${i}" ${ans!==null?'disabled':''}>${t}</button>`).join('')}
${ans!==null?`<div class="fb ${ans===q.k?'right':'wrong'}" role="status"><b>${ans===q.k?'Benar!':'Belum tepat.'}</b> ${ans===q.k?'':'Jawaban yang benar: <b>'+q.o[q.k]+'</b>. '}${q.e}</div><div class="row"><button class="btn" id="nx">${T.i===T.q.length-1?'Lihat hasil':'Soal berikutnya'}</button></div>`:''}</div>`;
 $$('.opt').forEach(b=>b.onclick=()=>{if(T.a!==null)return;T.a=+b.dataset.i;const ok=T.a===q.k;if(ok)T.sc++;(T.res=T.res||[])[T.i]=ok;V.tantangan()});
 const nx=$('#nx');if(nx)nx.onclick=()=>{T.i++;T.a=null;V.tantangan();window.scrollTo(0,0)}};

V.pengembang=()=>{$('#view').innerHTML=`<h2>Pengembang</h2><div class="card"><h3>Devan Aditya Rahman, M.Pd.</h3><p>Guru IPA, SMP Negeri 10 Buru<br>NIP 19910209 201903 1 011</p>
<p class="note">Game edukatif untuk mata pelajaran IPA Fase D / Kelas VIII, Bab 2 Struktur dan Fungsi Tubuh Makhluk Hidup (Sistem Pencernaan Manusia), Kurikulum Merdeka – Pembelajaran Mendalam, Tahun Pelajaran 2026/2027.</p>
<p class="note">Berjalan di peramban tanpa koneksi internet setelah dibuka.</p></div>`};
V.referensi=()=>{$('#view').innerHTML=`<h2>Referensi</h2><div class="card"><ul class="tj">
<li>Kemendikbudristek. <i>Ilmu Pengetahuan Alam SMP/MTs Kelas VIII</i> (Kurikulum Merdeka). Jakarta: Pusat Perbukuan.</li>
<li>Urry, L. A., dkk. <i>Campbell Biology</i>. Pearson.</li>
<li>Sherwood, L. <i>Human Physiology: From Cells to Systems</i>. Cengage Learning.</li>
<li>Keputusan Kepala BSKAP Nomor 046/H/KR/2025 tentang Capaian Pembelajaran.</li>
<li>Alur Tujuan Pembelajaran IPA Kelas VIII SMP Negeri 10 Buru Tahun Pelajaran 2026/2027.</li>
<li>Ilustrasi sistem pencernaan: gambar yang disediakan penyusun.</li></ul><p class="note">Sesuaikan dengan edisi buku yang dipakai di sekolah.</p></div>`};

/* konfeti */
function fire(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const col=['#0f6b73','#79d2d6','#ff8a7a','#f2c230','#3b82f6'],ps=Array.from({length:90},()=>({x:c.width/2,y:c.height/2+100,vx:(Math.random()-.5)*18,vy:(Math.random()-1)*18-5,s:Math.random()*9+5,c:col[Math.floor(Math.random()*col.length)],r:Math.random()*360,rs:(Math.random()-.5)*10}));
 (function u(){x.clearRect(0,0,c.width,c.height);let a=false;ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.5;p.r+=p.rs;if(p.y<c.height)a=true;x.save();x.translate(p.x,p.y);x.rotate(p.r*Math.PI/180);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s);x.restore()});if(a)requestAnimationFrame(u);else x.clearRect(0,0,c.width,c.height)})()}

go(TABS.some(t=>t[0]===location.hash.slice(1))?location.hash.slice(1):'tujuan');
</script></body></html>
